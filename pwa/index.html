<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102A43">
<title>مقصد</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مقصد">
<style>
  html,body{height:100%;margin:0}
  body{background:#102A43;color:#F3F6F9;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;
       display:flex;align-items:center;justify-content:center;text-align:center}
  .w{padding:24px}
  .logo{display:flex;flex-direction:column;align-items:center;gap:18px}
  .logo .mono{width:78px;height:78px;color:#F3F6F9;overflow:visible}
  .logo .wm{height:44px;width:auto;color:#F3F6F9}
  .sub{color:#C9D6E3;margin-top:18px;font-size:15px}
  /* ثلاث نقاط تضيء بالتتابع بدل الدائرة الدوّارة */
  .sp{display:flex;gap:7px;justify-content:center;margin:24px auto 0}
  .sp i{width:9px;height:9px;background:#E9A23B;border-radius:50%;opacity:.25;animation:k 1.2s ease-in-out infinite}
  .sp i:nth-child(2){animation-delay:.2s}.sp i:nth-child(3){animation-delay:.4s}
  @keyframes k{40%{opacity:1}80%,100%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.sp i{animation:none;opacity:.8}}
  .err{display:none;max-width:340px;margin:0 auto}
  .err p{color:#C9D6E3;line-height:1.8;font-size:15px;margin-top:18px}
  button{margin-top:14px;background:#E9A23B;color:#102A43;border:0;border-radius:12px;
         padding:13px 30px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="w">
  <div id="load">
    <div class="logo"><svg class="mono" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><circle cx="50" cy="37" r="19.5" fill="none" stroke="currentColor" stroke-width="14"/><path d="M43 52 L57 52 L51.6 87 Q50 91.5 48.4 87 Z" fill="currentColor"/><ellipse cx="50" cy="94" rx="11" ry="3.2" fill="#E9A23B"/></svg><svg class="wm" viewBox="56 18 222 66" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><circle cx="262" cy="58" r="11"/><path d="M258 69 L240 69"/><circle cx="229" cy="57" r="11"/><path d="M232 69 L205 69"/><path d="M205 69 L205 60 Q205 47 190 47 L168 47 Q156 47 156 58 Q156 69 168 69 L205 69"/><path d="M168 69 L140 69 L140 59 M140 69 L112 69"/><path d="M112 69 L96 40"/><path d="M112 69 L74 69 Q66 69 66 61"/></g><g fill="#E9A23B"><circle cx="223" cy="29" r="5.5"/><circle cx="237" cy="29" r="5.5"/></g></svg></div>
    <div class="sub">جاري فتح المنصة…</div>
    <div class="sp" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <div class="err" id="err">
    <div class="logo"><svg class="mono" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><circle cx="50" cy="37" r="19.5" fill="none" stroke="currentColor" stroke-width="14"/><path d="M43 52 L57 52 L51.6 87 Q50 91.5 48.4 87 Z" fill="currentColor"/><ellipse cx="50" cy="94" rx="11" ry="3.2" fill="#E9A23B"/></svg><svg class="wm" viewBox="56 18 222 66" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><circle cx="262" cy="58" r="11"/><path d="M258 69 L240 69"/><circle cx="229" cy="57" r="11"/><path d="M232 69 L205 69"/><path d="M205 69 L205 60 Q205 47 190 47 L168 47 Q156 47 156 58 Q156 69 168 69 L205 69"/><path d="M168 69 L140 69 L140 59 M140 69 L112 69"/><path d="M112 69 L96 40"/><path d="M112 69 L74 69 Q66 69 66 61"/></g><g fill="#E9A23B"><circle cx="223" cy="29" r="5.5"/><circle cx="237" cy="29" r="5.5"/></g></svg></div>
    <p>تعذّر الاتصال بالمنصة.<br>تأكد من اتصالك بالإنترنت وحاول مرة أخرى.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
    <p id="why" style="font-size:12px;opacity:.45;margin-top:18px"></p>
  </div>
</div>

<script>
// تسجيل عامل الخدمة أولاً — قبل أن تُعاد كتابة الصفحة
try {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function(){});
} catch (e) {}

(function () {
  var SRC = "https://dindcejhsaxqwdkxtkcy.supabase.co/functions/v1/app";
  var KEY = "maqsad_ui_v1";
  var rendered = false, tries = 0;

  function store(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function read()    { try { return localStorage.getItem(KEY); } catch (e) { return null; } }

  function paint(html) {
    rendered = true;
    document.open();
    document.write(html);
    document.close();
  }

  function updateBar() {
    // بعد إعادة الكتابة، نضيف شريطاً صغيراً يخبره أن نسخة أحدث جاهزة
    try {
      if (document.getElementById("maqsad-upd")) return;
      var b = document.createElement("div");
      b.id = "maqsad-upd";
      b.setAttribute("style",
        "position:fixed;inset-inline:0;bottom:0;z-index:99999;display:flex;align-items:center;" +
        "justify-content:space-between;gap:12px;background:#102A43;color:#F3F6F9;font-size:14px;" +
        "font-family:system-ui,Tahoma,sans-serif;padding:12px 16px;" +
        "padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))");
      b.innerHTML = '<span>يوجد تحديث جديد لمقصد</span>';
      var btn = document.createElement("button");
      btn.textContent = "تحديث";
      btn.setAttribute("style",
        "background:#E9A23B;color:#102A43;border:0;border-radius:12px;padding:8px 18px;" +
        "font-size:14px;font-weight:700;font-family:inherit;cursor:pointer");
      btn.onclick = function () { location.reload(); };
      b.appendChild(btn);
      document.body.appendChild(b);
    } catch (e) {}
  }

  function fail(m) {
    if (rendered) return;
    var l = document.getElementById("load"), e = document.getElementById("err");
    if (l) l.style.display = "none";
    if (e) { e.style.display = "block"; }
    var w = document.getElementById("why");
    if (w) w.textContent = m || "";
  }

  function fetchFresh() {
    return fetch(SRC + "?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (html) {
        if (!html || html.length < 2000) throw new Error("محتوى غير مكتمل");
        return html;
      });
  }

  // ١) نسخة محفوظة؟ اعرضها فوراً ثم حدّثها في الخلفية
  var cached = read();
  if (cached && cached.length > 2000) {
    // ننتظر انتهاء تحليل الصفحة أولاً، وإلا أُضيفت الواجهة فوق شاشة التحميل بدل أن تحل محلها
    setTimeout(function () {
      paint(cached);
      fetchFresh().then(function (fresh) {
        if (fresh !== cached) { store(fresh); updateBar(); }
      }).catch(function () {});
    }, 0);
    return;
  }

  // ٢) أول زيارة: اجلب واعرض واحفظ
  (function go() {
    tries++;
    fetchFresh()
      .then(function (html) { store(html); setTimeout(function(){ paint(html); }, 0); })
      .catch(function (e) {
        if (tries < 3) return setTimeout(go, 1000 * tries);
        fail(String(e && e.message ? e.message : e));
      });
  })();
})();
</script>
</body>
</html>
